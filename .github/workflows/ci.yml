name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install pytest ruff numpy pyyaml rich tqdm transformers scikit-learn
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Compile Python sources
        run: python -m compileall -q obliteratus tests

      - name: Ruff critical checks
        run: python -m ruff check --select E9,F63,F7,F82 .

      - name: Representative pytest suite
        run: python -m pytest tests/test_config.py tests/test_refusal_detection.py tests/test_cli.py
